<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ludix - Sandbox</title>

<meta name="description" content="Ludix Sandbox - Mundo de sobrevivência">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#10151b;
    color:white;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   TELA DE CONTA
========================= */

#accountScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top,#1f4055,#10151b 60%);
}

.accountBox{
    width:min(420px,92%);
    background:rgba(20,28,35,.97);
    border:1px solid #40515e;
    border-radius:18px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo span{
    color:#55cfff;
}

.subtitle{
    text-align:center;
    color:#aebbc4;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    border:0;
    border-radius:9px;
    padding:12px;
    background:#202b34;
    color:#aaa;
    font-weight:bold;
}

.tab.active{
    background:#2479a8;
    color:white;
}

.form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.form label{
    font-size:14px;
    color:#cbd5db;
}

.form input{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #40515e;
    background:#111820;
    color:white;
    outline:none;
}

.form input:focus{
    border-color:#42b9ef;
}

.mainButton{
    border:0;
    border-radius:10px;
    padding:14px;
    background:#29a6e0;
    color:white;
    font-weight:bold;
    font-size:16px;
    margin-top:8px;
}

.mainButton:hover{
    background:#36b5ed;
}

.message{
    min-height:22px;
    text-align:center;
    margin-top:12px;
    color:#ffd166;
    font-size:14px;
}

/* =========================
   MENU
========================= */

#menuScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(#162d38,#10151b);
}

.menuBox{
    width:min(600px,92%);
    text-align:center;
    background:rgba(19,27,34,.96);
    border:1px solid #3c4d58;
    border-radius:18px;
    padding:35px;
}

.menuBox h1{
    font-size:42px;
    margin-bottom:10px;
}

.menuBox p{
    color:#aebbc4;
    margin-bottom:25px;
}

.menuButton{
    width:100%;
    border:0;
    border-radius:10px;
    padding:15px;
    margin-top:10px;
    font-size:17px;
    font-weight:bold;
    background:#238bc0;
    color:white;
}

.menuButton:hover{
    background:#2ba1dc;
}

.logoutButton{
    background:#5b3030;
}

.logoutButton:hover{
    background:#793d3d;
}

/* =========================
   INFO DO MUNDO
========================= */

#worldScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#101820;
}

.worldBox{
    width:min(650px,94%);
    background:#19232b;
    border:1px solid #42535e;
    border-radius:18px;
    padding:30px;
}

.worldBox h2{
    margin-bottom:20px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.infoCard{
    background:#111920;
    border-radius:10px;
    padding:15px;
}

.infoCard strong{
    display:block;
    margin-bottom:5px;
    color:#54c8f5;
}

.startGame{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#38a956;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* =========================
   JOGO
========================= */

#gameScreen{
    position:fixed;
    inset:0;
    background:#75c9ef;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
}

#hud{
    position:absolute;
    left:12px;
    top:12px;
    z-index:10;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;
    padding:10px 14px;
    line-height:1.6;
    min-width:210px;
}

#pauseButton{
    position:absolute;
    right:12px;
    top:12px;
    z-index:10;
    border:0;
    border-radius:9px;
    padding:10px 16px;
    background:rgba(0,0,0,.6);
    color:white;
    font-weight:bold;
}

#loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#10151b;
    font-size:22px;
}

/* =========================
   PAUSA
========================= */

#pauseScreen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
}

.pauseBox{
    width:min(400px,90%);
    background:#19232b;
    border:1px solid #455762;
    border-radius:16px;
    padding:30px;
    text-align:center;
}

.pauseBox h2{
    margin-bottom:20px;
}

.pauseBox button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:9px;
    background:#278fc1;
    color:white;
    font-weight:bold;
}

@media(max-width:600px){

    .info{
        grid-template-columns:1fr;
    }

    .menuBox h1{
        font-size:32px;
    }

    .accountBox{
        padding:22px;
    }

}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">
    Carregando Ludix Sandbox...
</div>

<!-- =========================
     CONTA
========================= -->

<section id="accountScreen" class="hidden">

    <div class="accountBox">

        <div class="logo">
            🎮 <span>ludix</span>
        </div>

        <div class="subtitle">
            Sandbox
        </div>

        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                onclick="showLogin()">
                Entrar
            </button>

            <button
                id="registerTab"
                class="tab"
                onclick="showRegister()">
                Criar conta
            </button>

        </div>

        <!-- LOGIN -->

        <div id="loginForm" class="form">

            <label>Nome de usuário</label>

            <input
                id="loginUsername"
                type="text"
                maxlength="30"
                autocomplete="username"
                placeholder="Digite seu nome">

            <label>Senha</label>

            <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha">

            <button
                class="mainButton"
                onclick="loginUser()">
                ENTRAR

        </div>

        <!-- CADASTRO -->

        <div id="registerForm" class="form hidden">

            <label>Nome de usuário</label>

            <input
                id="registerUsername"
                type="text"
                maxlength="30"
                autocomplete="username"
                placeholder="Escolha seu nome">

            <label>Senha</label>

            <input
                id="registerPassword"
                type="password"
                autocomplete="new-password"
                placeholder="Mínimo de 6 caracteres">

            <label>Confirmar senha</label>

            <input
                id="registerPasswordConfirm"
                type="password"
                autocomplete="new-password"
                placeholder="Digite a senha novamente">

            <button

            </button>

        <div

    </div>

</section>

<!-- =========================
     MENU
========================= -->

<section id="menuScreen" class="hidden">

    <div class="menuBox">

        <h1>🌍 Ludix Sandbox</h1>

        <p>
            Bem-vindo, <strong id="menuUsername"></strong>
        </p>

        <button
            class="menuButton"
            onclick="openWorld()">
            🌍 JOGAR
        </button>

        <button
            class="menuButton logoutButton"
            onclick="logoutUser()">
            SAIR DA CONTA
        </button>

    </div>

</section>

<!-- =========================
     MUNDO
========================= -->

<section id="worldScreen" class="hidden">

    <div class="worldBox">

        <h2>🌎 Seu mundo</h2>

        <div class="info">

            <div class="infoCard">
                <strong>Tamanho</strong>
                1.000.000 blocos para cada lado
            </div>

            <div class="infoCard">
                <strong>Geração</strong>
                Aleatória por regiões
            </div>

            <div class="infoCard">
                <strong>Jogador</strong>
                <span id="worldUsername"></span>
            </div>

            <div class="infoCard">
                <strong>Salvamento</strong>
                Conta do jogador
            </div>

        </div>

        <button
            class="startGame"
            onclick="startGame()">
            🌱 ENTRAR NO MUNDO
        </button>

    </div>

</section>

<!-- =========================
     JOGO
========================= -->

<section id="gameScreen" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">

        👤 <span id="hudUsername"></span><br>

        ❤️ Vida:
        <span id="healthValue">100</span><br>

        🍖 Fome:
        <span id="hungerValue">100</span><br>

        📍 X:
        <span id="xValue">0</span><br>

        📍 Y:
        <span id="yValue">0</span>

    </div>

    <button
        id="pauseButton"
        onclick="pauseGame()">
        ⏸ PAUSAR
    </button>

</section>

<!-- =========================
     PAUSA
========================= -->

<section id="pauseScreen" class="hidden">

    <div class="pauseBox">

        <h2>⏸ Jogo pausado</h2>

        <button onclick="resumeGame()">
            ▶ CONTINUAR
        </button>

        <button onclick="backToMenu()">
            🏠 MENU
        </button>

    </div>

</section>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://lvsegfkvggwlcxhaibgu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hBXJE72D0W6D4dF6mDhJHg_smw2yH9h";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIÁVEIS
========================================================= */

let currentPlayer = null;

let gameRunning = false;
let gamePaused = false;

const WORLD_SIZE = 1000000;
const CHUNK_SIZE = 32;

let worldSeed = 0;

let player = {
    x:0,
    y:0,
    vx:0,
    vy:0,
    width:24,
    height:40,
    health:100,
    hunger:100
};

const keys = {};


/* =========================================================
   ELEMENTOS
========================================================= */

const accountScreen =
    document.getElementById("accountScreen");

const menuScreen =
    document.getElementById("menuScreen");

const worldScreen =
    document.getElementById("worldScreen");

const gameScreen =
    document.getElementById("gameScreen");

const pauseScreen =
    document.getElementById("pauseScreen");

const loading =
    document.getElementById("loading");

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   MENSAGEM
========================================================= */

function showMessage(message){

    document
        .getElementById("accountMessage")
        .textContent = message;

}


/* =========================================================
   LOGIN
========================================================= */

function showLogin(){

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    showMessage("");

}


/* =========================================================
   CADASTRO
========================================================= */

function showRegister(){

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.add("active");

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    showMessage("");

}


/* =========================================================
   NORMALIZAR USUÁRIO
========================================================= */

function normalizeUsername(username){

    return username
        .trim()
        .toLowerCase();

}


/* =========================================================
   EMAIL INTERNO
========================================================= */

function usernameToEmail(username){

    const normalized =
        normalizeUsername(username);

    return normalized +
        "@ludixs.com";

}


/* =========================================================
   CRIAR CONTA
========================================================= */

async function registerUser(){

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const confirmPassword =
        document
            .getElementById("registerPasswordConfirm")
            .value;


    if(username.length < 3){

        showMessage(
            "O nome precisa ter pelo menos 3 caracteres."
        );

        return;

    }


    if(!/^[a-zA-Z0-9_]+$/.test(username)){

        showMessage(
            "Use somente letras, números e _ no nome."
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "A senha precisa ter pelo menos 6 caracteres."
        );

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "As senhas não são iguais."
        );

        return;

    }


    showMessage(
        "Criando sua conta..."
    );


    const email =
        usernameToEmail(username);


    try{

        const { data, error } =
            await supabaseClient.auth.signUp({

                email:email,

                password:password,

                options:{
                    data:{
                        username:username
                    }
                }

            });


        if(error){

            console.error(error);

            if(
                error.message
                    .toLowerCase()
                    .includes("already")
            ){

                showMessage(
                    "Esse nome de usuário já está em uso."
                );

            }else{

                showMessage(
                    "Erro ao criar conta: " +
                    error.message
                );

            }

            return;

        }


        if(!data.user){

            showMessage(
                "Não foi possível criar a conta."
            );

            return;

        }


        currentPlayer = {

            id:data.user.id,

            username:username

        };


        await createPlayerWorld(
            data.user.id
        );


        showMessage(
            "Conta criada com sucesso!"
        );


        setTimeout(
            () => {

                openMenu();

            },
            700
        );


    }catch(error){

        console.error(error);

        showMessage(
            "Ocorreu um erro ao criar a conta."
        );

    }

}


/* =========================================================
   LOGIN
========================================================= */

async function loginUser(){

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if(!username || !password){

        showMessage(
            "Digite seu nome e sua senha."
        );

        return;

    }


    showMessage(
        "Entrando..."
    );


    const email =
        usernameToEmail(username);


    try{

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            console.error(error);

            showMessage(
                "Nome ou senha incorretos."
            );

            return;

        }


        if(!data.user){

            showMessage(
                "Não foi possível entrar."
            );

            return;

        }


        currentPlayer = {

            id:data.user.id,

            username:
                data.user.user_metadata?.username ||
                username

        };


        await loadPlayerWorld(
            data.user.id
        );


        openMenu();


    }catch(error){

        console.error(error);

        showMessage(
            "Erro ao entrar na conta."
        );

    }

}


/* =========================================================
   CRIAR MUNDO
========================================================= */

async function createPlayerWorld(userId){

    try{

        const existing =
            await supabaseClient
                .from("worlds")
                .select("*")
                .eq("user_id",userId)
                .maybeSingle();


        if(existing.data){

            worldSeed =
                Number(existing.data.seed);

            player.x =
                Number(existing.data.player_x);

            player.y =
                Number(existing.data.player_y);

            player.health =
                Number(existing.data.health);

            player.hunger =
                Number(existing.data.hunger);

            return existing.data;

        }


        worldSeed =
            Math.floor(
                Math.random() * 2147483647
            );


        const { data, error } =
            await supabaseClient
                .from("worlds")
                .insert({

                    user_id:userId,

                    seed:worldSeed,

                    world_size:WORLD_SIZE,

                    player_x:0,

                    player_y:0,

                    health:100,

                    hunger:100

                })
                .select()
                .single();


        if(error){

            console.error(
                "Erro ao criar mundo:",
                error
            );

            return null;

        }


        player.x = 0;
        player.y = 0;
        player.health = 100;
        player.hunger = 100;


        return data;


    }catch(error){

        console.error(error);

        return null;

    }

}


/* =========================================================
   CARREGAR MUNDO
========================================================= */

async function loadPlayerWorld(userId){

    const { data, error } =
        await supabaseClient
            .from("worlds")
            .select("*")
            .eq("user_id",userId)
            .maybeSingle();


    if(error){

        console.error(
            "Erro carregando mundo:",
            error
        );

        return;

    }


    if(!data){

        await createPlayerWorld(userId);

        return;

    }


    worldSeed =
        Number(data.seed);

    player.x =
        Number(data.player_x);

    player.y =
        Number(data.player_y);

    player.health =
        Number(data.health);

    player.hunger =
        Number(data.hunger);

}


/* =========================================================
   SALVAR MUNDO
========================================================= */

async function savePlayerWorld(){

    if(!currentPlayer){

        return;

    }


    try{

        await supabaseClient
            .from("worlds")
            .update({

                player_x:player.x,

                player_y:player.y,

                health:player.health,

                hunger:player.hunger,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "user_id",
                currentPlayer.id
            );


    }catch(error){

        console.error(
            "Erro salvando mundo:",
            error
        );

    }

}


/* =========================================================
   MENU
========================================================= */

function openMenu(){

    accountScreen
        .classList.add("hidden");

    worldScreen
        .classList.add("hidden");

    gameScreen
        .classList.add("hidden");

    pauseScreen
        .classList.add("hidden");

    menuScreen
        .classList.remove("hidden");


    document
        .getElementById("menuUsername")
        .textContent =
            currentPlayer.username;

}


/* =========================================================
   ABRIR MUNDO
========================================================= */

function openWorld(){

    menuScreen
        .classList.add("hidden");

    worldScreen
        .classList.remove("hidden");


    document
        .getElementById("worldUsername")
        .textContent =
            currentPlayer.username;

}


/* =========================================================
   SAIR
========================================================= */

async function logoutUser(){

    await savePlayerWorld();

    await supabaseClient.auth.signOut();

    currentPlayer = null;

    gameRunning = false;

    menuScreen
        .classList.add("hidden");

    worldScreen
        .classList.add("hidden");

    gameScreen
        .classList.add("hidden");

    pauseScreen
        .classList.add("hidden");

    accountScreen
        .classList.remove("hidden");

    showLogin();

}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   RANDOM
========================================================= */

function seededRandom(x,y){

    let value =
        Math.sin(
            x * 12.9898 +
            y * 78.233 +
            worldSeed
        ) *
        43758.5453;

    return value -
        Math.floor(value);

}


/* =========================================================
   TERRENO
========================================================= */

function terrainHeight(worldX){

    const n =
        seededRandom(
            Math.floor(worldX / 32),
            0
        );

    return 420 +
        Math.floor(n * 80);

}


/* =========================================================
   INICIAR JOGO
========================================================= */

async function startGame(){

    worldScreen
        .classList.add("hidden");

    gameScreen
        .classList.remove("hidden");


    resizeCanvas();


    if(!worldSeed){

        worldSeed =
            Math.floor(
                Math.random() * 2147483647
            );

    }


    gameRunning = true;

    gamePaused = false;


    document
        .getElementById("hudUsername")
        .textContent =
            currentPlayer.username;


    updateHUD();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
        .getElementById("healthValue")
        .textContent =
            Math.max(
                0,
                Math.floor(player.health)
            );

    document
        .getElementById("hungerValue")
        .textContent =
            Math.max(
                0,
                Math.floor(player.hunger)
            );

    document
        .getElementById("xValue")
        .textContent =
            Math.floor(player.x);

    document
        .getElementById("yValue")
        .textContent =
            Math.floor(player.y);

}


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[event.key.toLowerCase()] = true;


        if(event.key === "Escape"){

            if(gameRunning){

                if(gamePaused){

                    resumeGame();

                }else{

                    pauseGame();

                }

            }

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================================================
   MOVIMENTO
========================================================= */

function updatePlayer(){

    const speed = 4;


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        player.x -= speed;

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        player.x += speed;

    }


    if(player.x < -WORLD_SIZE){

        player.x =
            -WORLD_SIZE;

    }


    if(player.x > WORLD_SIZE){

        player.x =
            WORLD_SIZE;

    }


    const ground =
        terrainHeight(player.x);


    player.y =
        ground -
        player.height;


    updateHUD();

}


/* =========================================================
   DESENHAR MUNDO
========================================================= */

function drawWorld(){

    const width =
        canvas.width;

    const height =
        canvas.height;


    /* CÉU */

    ctx.fillStyle =
        "#75c9ef";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* NUVENS */

    ctx.fillStyle =
        "rgba(255,255,255,.75)";


    for(
        let i = 0;
        i < 7;
        i++
    ){

        const cloudX =
            (
                i * 350 -
                player.x * 0.15
            ) %
            (width + 500);


        const normalizedX =
            cloudX < -100
                ? cloudX + width + 500
                : cloudX;


        ctx.fillRect(
            normalizedX,
            100 + i * 35,
            100,
            25
        );

        ctx.fillRect(
            normalizedX + 25,
            80 + i * 35,
            55,
            25
        );

    }


    /* CÂMERA */

    const cameraX =
        player.x -
        width / 2;


    /* TERRENO */

    const blockSize = 32;


    for(
        let screenX = 0;
        screenX < width + blockSize;
        screenX += blockSize
    ){

        const worldX =
            cameraX +
            screenX;


        const ground =
            terrainHeight(worldX);


        const screenGround =
            ground -
            player.y +
            height * 0.55;


        /* GRAMA */

        ctx.fillStyle =
            "#4c9b45";

        ctx.fillRect(
            screenX,
            screenGround,
            blockSize,
            blockSize
        );


        /* TERRA */

        ctx.fillStyle =
            "#795548";

        ctx.fillRect(
            screenX,
            screenGround + blockSize,
            blockSize,
            height
        );


        /* PEDRAS */

        if(
            seededRandom(
                Math.floor(
                    worldX / blockSize
                ),
                2
            ) > .85
        ){

            ctx.fillStyle =
                "#777";

            ctx.fillRect(
                screenX + 7,
                screenGround + 45,
                8,
                8
            );

        }

    }


    /* JOGADOR */

    const playerScreenX =
        width / 2 -
        player.width / 2;


    const playerScreenY =
        height * 0.55 -
        player.height;


    ctx.fillStyle =
        "#315cff";

    ctx.fillRect(
        playerScreenX,
        playerScreenY,
        player.width,
        player.height
    );


    /* CABEÇA */

    ctx.fillStyle =
        "#f1c27d";

    ctx.fillRect(
        playerScreenX + 3,
        playerScreenY - 16,
        player.width - 6,
        16
    );

}


/* =========================================================
   LOOP
========================================================= */

function gameLoop(){

    if(!gameRunning){

        return;

    }


    if(!gamePaused){

        updatePlayer();

        drawWorld();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   PAUSA
========================================================= */

function pauseGame(){

    if(!gameRunning){

        return;

    }


    gamePaused = true;

    pauseScreen
        .classList
        .remove("hidden");

}


/* =========================================================
   CONTINUAR
========================================================= */

function resumeGame(){

    gamePaused = false;

    pauseScreen
        .classList
        .add("hidden");

}


/* =========================================================
   MENU
========================================================= */

async function backToMenu(){

    await savePlayerWorld();

    gameRunning = false;

    gamePaused = false;

    pauseScreen
        .classList
        .add("hidden");

    gameScreen
        .classList
        .add("hidden");

    openMenu();

}


/* =========================================================
   SALVAMENTO AUTOMÁTICO
========================================================= */

setInterval(
    () => {

        if(
            currentPlayer &&
            gameRunning &&
            !gamePaused
        ){

            savePlayerWorld();

        }

    },
    10000
);


/* =========================================================
   SESSÃO EXISTENTE
========================================================= */

async function checkSession(){

    try{

        const { data } =
            await supabaseClient
                .auth
                .getSession();


        if(
            data &&
            data.session &&
            data.session.user
        ){

            const user =
                data.session.user;


            const username =
                user.user_metadata?.username;


            if(username){

                currentPlayer = {

                    id:user.id,

                    username:username

                };


                await loadPlayerWorld(
                    user.id
                );


                openMenu();

                return;

            }

        }

    }catch(error){

        console.error(
            "Erro verificando sessão:",
            error
        );

    }


    accountScreen
        .classList
        .remove("hidden");

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

resizeCanvas();


setTimeout(
    async () => {

        loading
            .classList
            .add("hidden");

        await checkSession();

    },
    500
);

</script>
